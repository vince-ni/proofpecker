[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "proofpecker"
version = "0.1.0"
description = "Claim-by-claim AI review with frozen evidence and independent reviewers"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
authors = [{name = "Vince Ni"}]
dependencies = []

[project.urls]
Repository = "https://github.com/vince-ni/proofpecker"

[project.scripts]
proofpecker = "proofpecker:main"

[tool.setuptools]
package-dir = {"" = "skills/proofpecker/scripts"}
py-modules = ["proofpecker", "pecker_models"]
packages = ["pecker_example"]

[tool.setuptools.package-data]
pecker_example = ["plan.json", "capture.txt", "requirement.md"]
